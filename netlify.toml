[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Funciones de reservas (/api/availability, /api/book)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Caché larga para los assets con hash y las fotos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
